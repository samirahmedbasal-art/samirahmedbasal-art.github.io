function renderBodyInsights(){

  if(!ms.length){target.innerHTML="";return}
  const latest=ms[ms.length-1],prev=ms.length>1?ms[ms.length-2]:null,fmt=x=>x==null?"—":(x>0?"+":"")+(Math.round(x*10)/10);
  const fields=[["weight",L("الوزن","Weight"),"kg"],["fatPct",L("نسبة الدهون","Body fat"),"%"],["muscle",L("العضلات الهيكلية","Skeletal muscle"),"kg"],["fat",L("كتلة الدهون","Fat mass"),"kg"],["visceral",L("الدهون الحشوية","Visceral fat"),""]];
  const cards=fields.filter(x=>latest[x[0]]!=null);

  if(prev){const dm=(latest.muscle??0)-(prev.muscle??0),df=(latest.fat??0)-(prev.fat??0),dp=(latest.fatPct??0)-(prev.fatPct??0);
    if(latest.muscle!=null&&prev.muscle!=null&&latest.fat!=null&&prev.fat!=null&&dm>=0&&df<0)advice=L("اتجاه جيد لإعادة تركيب الجسم: كتلة العضلات مستقرة/أعلى وكتلة الدهون أقل. واصل خطة مقاومة منتظمة وتابع القياس في ظروف متشابهة.","Favorable recomposition trend: muscle is stable or higher while fat mass is lower. Keep a consistent resistance plan and compare measurements under similar conditions.");
    else if(dp<-.3||df<-.3)advice=L("نسبة الدهون أو كتلتها انخفضت. حافظ على الروتين وتابع متوسط عدة قياسات بدل الاعتماد على قراءة واحدة.","Body-fat percentage or mass is down. Keep your routine and follow several readings rather than relying on one result.");
    else if(dm<-.3)advice=L("كتلة العضلات انخفضت بين القياسين. راجع انتظام تمارين المقاومة والتعافي، وأعد القياس في ظروف متشابهة.","Muscle mass is down between readings. Review resistance training and recovery, then remeasure under similar conditions.");
    else advice=L("المؤشرات قريبة من القياس السابق. استمر وسجّل القياس القادم في توقيت وظروف مشابهة.","Your readings are close to the previous check. Continue your routine and measure again under similar conditions.");
  }

}
function openPhotoDB(){return new Promise((resolve,reject)=>{if(!window.indexedDB){reject(new Error("IndexedDB unavailable"));return}const req=indexedDB.open("ironlog-private-v1",2);req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains("photos"))req.result.createObjectStore("photos",{keyPath:"month"});if(!req.result.objectStoreNames.contains("settings"))req.result.createObjectStore("settings",{keyPath:"key"})};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
async function photoRequest(method,value){const db=await openPhotoDB();return new Promise((resolve,reject)=>{const tx=db.transaction("photos","readwrite"),store=tx.objectStore("photos"),req=store[method](value);req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);tx.oncomplete=()=>db.close();tx.onerror=()=>{db.close();reject(tx.error)}})}

const WD=["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"],MN=["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
const SL=[];[6,1,3].forEach(d=>SL.push([d,9,15,"m"],[d,15,21,"w"],[d,21,29,"m"]));[0,2,4].forEach(d=>SL.push([d,9,16,"w"],[d,16,29,"m"]));SL.push([5,15,21,"m"]);
const fh=h=>{h%=24;return S.prefs.language=="en"?(h%12||12)+":00 "+(h<12?"AM":"PM"):(h%12||12)+(h<12?"ص":"م")};
const hm=m=>{const h=Math.floor(m/60),x=m%60;return S.prefs.language=="en"?(h?h+" hr "+(x?x+" min":""):x+" min"):(h?h+" س"+(x?" و"+x+" د":""):x+" د")};
const toMin=s=>{const [h,m]=String(s||"").split(":").map(Number);return Number.isFinite(h)&&Number.isFinite(m)?h*60+m:null};
function gymHoursForDay(day){
  if(S.prefs.customGymHours){const x=S.prefs.gymHours[day];if(!x||!x.enabled)return[];const a=toMin(x.open),b=toMin(x.close);return a==null||b==null||a==b?[]:[[a,b+(b<=a?1440:0)]]}
  return SL.filter(x=>x[0]==day&&x[3]==S.g).map(x=>[x[1]*60,x[2]*60]);
}
function gymNow(){
  const n=new Date(),t=n.getDay()*1440+n.getHours()*60+n.getMinutes(),week=10080,q=[];
  if(S.prefs.customGymHours){S.prefs.gymHours.forEach((x,d)=>{if(!x.enabled)return;const a=toMin(x.open),b=toMin(x.close);if(a==null||b==null||a==b)return;q.push({start:d*1440+a,end:d*1440+b+(b<=a?1440:0),day:d,close:b})})}
  else SL.filter(x=>x[3]==S.g).forEach(x=>q.push({start:x[0]*1440+x[1]*60,end:x[0]*1440+x[2]*60,day:x[0],close:x[2]}));
  if(!q.length)return{open:0,empty:1};
  for(const x of q)for(const o of [0,week])if(t+o>=x.start&&t+o<x.end)return{open:1,left:x.end-t-o,end:x.close%24};
  let next=null;q.forEach(x=>[0,week].forEach(o=>{const start=x.start+o,dl=start-t;if(dl>=0&&(!next||dl<next.dl))next={dl,start:x.start%week,day:x.day,open:x.start%1440}}));
  return next?{open:0,...next}:{open:0,empty:1};
}
function todayCard(){
  const g=gymNow(),pk=S.plan[new Date().getDay()],d=pk&&DN[pk]?DN[pk]:null,who=S.g=="m"?"الرجال":"السيدات";
  const en=S.prefs.language=="en",status=g.empty?(en?"Set gym hours in Settings":"أضف مواعيد الجيم من الإعدادات"):g.open?(en?"Gym is open":"الجيم مفتوح لفترة "+who):(en?"Gym is closed":"مقفول على فترة "+who);

  return `<div class="card tc"><div><span class="dot ${g.open?"on":""}"></span><b>${status}</b><div class="mut">${hours}</div>

}
function calCard(){
  const n=new Date(),bs=new Date(n.getFullYear(),n.getMonth()+(S.cm||0),1),Y=bs.getFullYear(),Mo=bs.getMonth(),nd=new Date(Y,Mo+1,0).getDate(),off=S.prefs.language=="en"?bs.getDay():(bs.getDay()+1)%7,by={};
  S.ss.forEach(x=>{(by[x.d]=by[x.d]||[]).push(x.k)});
  let c=(S.prefs.language=="en"?["S","M","T","W","T","F","S"]:["س","ح","ن","ث","ر","خ","ج"]).map(x=>`<span class=hd>${x}</span>`).join("");for(let i=0;i<off;i++)c+="<i></i>";
  for(let d=1;d<=nd;d++){const ds=Y+"-"+pad(Mo+1)+"-"+pad(d),k=by[ds];c+=`<b class="cd${k?" on":""}${ds==iso()?" td":""}"${k?` style="--c:${DN[k[0]][2]}"`:""}>${d}</b>`}
  let st=0;for(let i=0;i<120;i++){const q=new Date(n.getFullYear(),n.getMonth(),n.getDate()-i),ds=q.getFullYear()+"-"+pad(q.getMonth()+1)+"-"+pad(q.getDate());if(by[ds])st++;else if(i==0||S.plan[q.getDay()]=="r")continue;else break}
  const cnt=m=>Object.keys(by).filter(d=>ym(d)==m).length,cm=Y+"-"+pad(Mo+1);

async function jpgs(r){
  const W=1240,H=1754,M=60,F='"Noto Sans Arabic",Tahoma,"Segoe UI",Arial,sans-serif',pg=[];let cx,y;
  const np=()=>{const c=document.createElement("canvas");c.width=W;c.height=H;cx=c.getContext("2d");cx.fillStyle="#fff";cx.fillRect(0,0,W,H);cx.fillStyle="#000";cx.direction="rtl";cx.textAlign="right";cx.textBaseline="top";pg.push(c);y=M};
  const tx=(t,sz,b)=>{if(y+sz*1.8>H-M)np();cx.font=(b?"bold ":"")+sz+"px "+F;cx.fillText(t,W-M,y);y+=sz*1.8};
  const fit=(t,w)=>{t=String(t);if(cx.measureText(t).width<=w)return t;while(t.length>1&&cx.measureText(t+"…").width>w)t=t.slice(0,-1);return t+"…"};
  np();tx(r.title,44,1);tx(r.sum,26);y+=14;
  r.secs.forEach(s=>{
    y+=10;tx(s.h,32,1);
    if(!s.rows.length){tx("لا توجد بيانات",24);return}
    const ws=s.w.map(f=>f*(W-2*M)),rh=44;
    const row=(cells,hd)=>{if(y+rh>H-M)np();cx.font=(hd?"bold ":"")+"22px "+F;let x=W-M;cells.forEach((v,i)=>{if(hd){cx.fillStyle="#e5e7eb";cx.fillRect(x-ws[i],y,ws[i],rh);cx.fillStyle="#000"}cx.strokeStyle="#999";cx.lineWidth=1;cx.strokeRect(x-ws[i],y,ws[i],rh);cx.fillText(fit(v,ws[i]-16),x-8,y+10);x-=ws[i]});y+=rh};
    row(s.head,1);s.rows.forEach(c=>row(c));y+=10;
  });
  return pg.map(c=>{const b=atob(c.toDataURL("image/jpeg",.88).split(",")[1]),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return{b:u,w:W,h:H}});
}
function mkpdf(J){
  const enc=new TextEncoder(),parts=[],off=[];let len=0;
  const push=x=>{const u=typeof x=="string"?enc.encode(x):x;parts.push(u);len+=u.length};
  const obj=(id,fn)=>{off[id]=len;push(id+" 0 obj\n");fn();push("\nendobj\n")};
  const n=J.length,tot=3+n*3;
  push("%PDF-1.4\n");
  obj(1,()=>push("<</Type/Catalog/Pages 2 0 R>>"));
  obj(2,()=>push("<</Type/Pages/Kids["+J.map((_,i)=>(3+i*3)+" 0 R").join(" ")+"]/Count "+n+">>"));
  J.forEach((j,i)=>{
    const p=3+i*3,c="q 595 0 0 842 0 0 cm /Im0 Do Q";
    obj(p,()=>push(`<</Type/Page/Parent 2 0 R/MediaBox[0 0 595 842]/Resources<</XObject<</Im0 ${p+2} 0 R>>>>/Contents ${p+1} 0 R>>`));
    obj(p+1,()=>push(`<</Length ${c.length}>>\nstream\n${c}\nendstream`));
    obj(p+2,()=>{push(`<</Type/XObject/Subtype/Image/Width ${j.w}/Height ${j.h}/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length ${j.b.length}>>\nstream\n`);push(j.b);push("\nendstream")});
  });
  const xr=len;
  push("xref\n0 "+tot+"\n0000000000 65535 f \n");
  for(let i=1;i<tot;i++)push(String(off[i]).padStart(10,"0")+" 00000 n \n");
  push(`trailer\n<</Size ${tot}/Root 1 0 R>>\nstartxref\n${xr}\n%%EOF`);
  return new Blob(parts,{type:"application/pdf"});
}

    if(!e.alt.trim()){toast("اكتب البديل الأول");return}
    e.mem=e.mem||{};e.mem[e.n]=e.h;const old=e.n;e.n=e.alt.trim();e.alt=old;
    e.h=e.mem[e.n]||[];const p=lastOf(e);e.sets=e.sets.map(()=>({w:p?p.w:"",r:""}));
  }
  else if(a=="fin"){
    const T=iso();let n=0,V=0;
    list.forEach(x=>{
      const dn=x.sets.filter(q=>q.r!==""&&q.w!=="");if(!dn.length)return;n++;
      const top=Math.max(...dn.map(q=>+q.w)),ar=r1(avg(dn.map(q=>+q.r))),vol=dn.reduce((z,q)=>z+q.w*q.r,0);V+=vol;
      x.h=x.h.filter(p=>!(p.d==T&&p.s));x.h.push({d:T,w:top,r:ar,s:dn.map(q=>q.w+"×"+q.r+(q.f?"✓":"")),k:dn.filter(q=>q.f).length,v:vol,t:new Date().getHours()});
      x.sets=x.sets.map(()=>({w:top,r:"",f:false}));
    });
    if(!n){toast("اكتب العدات الأول");return}
    S.ss=S.ss.filter(z=>!(z.k==S.cur&&z.d==T&&z.v!=null));S.ss.push({k:S.cur,d:T,c:n,v:V,t:new Date().getHours()});
    toast("اتحفظ "+n+" تمارين ✓");
  }
  else if(a=="exps"){S.bk=iso();save();out(new Blob([JSON.stringify(S)],{type:"application/json"}),"gym-backup-"+S.bk+".json","share").catch(x=>toast("فشل: "+x.message))}
  else if(a=="txt"){const t=document.getElementById("bt");t.value=JSON.stringify(S);t.focus();t.select();return}
  else if(a=="itxt"){try{const d=JSON.parse(document.getElementById("bt").value);if(!d.days||!d.ss)throw 0;S=normalizeState(d);save();view();toast("اتسترجعت النسخة")}catch(e){toast("النص مش صالح")}return}
  else if(a=="imp"){document.getElementById("file").click();return}
  else if(a=="rv"){S.v="r";window.scrollTo(0,0)}
  else if(a=="pdfs"||a=="pdfd"||a=="pdfo"){pdf(a=="pdfs"?"share":a=="pdfd"?"down":"open");return}
  save();view();
});
document.getElementById("file").addEventListener("change",ev=>{
  const f=ev.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.days||!d.ss)throw 0;S=normalizeState(d);save();view();toast("اتسترجعت النسخة")}catch(e){toast("الملف مش صالح")}};
  r.readAsText(f);
});
const R={end:0,dur:90};
function tick(){const el=document.getElementById("rt");if(!R.end){el.hidden=true;return}const l=Math.ceil((R.end-Date.now())/1000);
  if(l<=0){R.end=0;el.hidden=true;try{navigator.vibrate&&navigator.vibrate([300,100,300])}catch(e){}toast("خلصت الراحة، ابدأ السيت الجاي 💪");return}
  el.hidden=false;document.getElementById("rtt").textContent=Math.floor(l/60)+":"+pad(l%60);document.getElementById("rtc").textContent="↻ "+R.dur+"ث"}
function rest(){R.end=Date.now()+R.dur*1000;tick()}
setInterval(tick,250);
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
{const pk=S.plan[new Date().getDay()];if(pk&&DN[pk])S.cur=pk}
view();loadBackgroundImage();
if("serviceWorker"in navigator&&location.protocol.indexOf("http")==0)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
